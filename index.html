<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>鋼琴五線譜</title>
  <meta name="theme-color" content="#fdfcf8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="鋼琴譜">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="intro">
  <main class="app">
    <section class="staff" aria-label="五線譜">
      <div id="staff-scroll" class="staff-scroll"></div>
      <div id="staff-header" class="staff-header"></div>
      <div class="staff-tools">
        <button type="button" id="clear" class="clear-button" disabled>清除</button>
        <div class="accidental-toggle" role="group" aria-label="黑鍵記法">
          <button type="button" data-mode="sharp" aria-pressed="true">♯ 升</button>
          <button type="button" data-mode="flat" aria-pressed="false">♭ 降</button>
        </div>
      </div>
    </section>
    <section id="keyboard" class="keyboard" aria-label="鋼琴鍵盤"></section>
  </main>

  <div id="audio-gate" class="audio-gate" role="button">
    <div class="audio-gate-icon">🔊</div>
    <p>點一下開始</p>
  </div>
  <div id="version" class="version"></div>
  <div id="audio-chip" class="audio-chip" role="status">音色載入中…</div>
  <pre id="debug" class="debug" hidden></pre>

  <div id="intro" class="intro-overlay" aria-hidden="true"></div>

  <div class="rotate-hint" role="alert">
    <div class="rotate-icon">⟳</div>
    <p>請將 iPad 橫放</p>
  </div>

  <script src="vendor/vexflow.js"></script>
  <script src="vendor/tone.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
