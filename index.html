<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>鋼琴五線譜</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="staff" aria-label="五線譜">
      <div id="staff-scroll" class="staff-scroll"></div>
      <div id="staff-header" class="staff-header"></div>
      <div class="accidental-toggle" role="group" aria-label="黑鍵記法">
        <button type="button" data-mode="sharp" aria-pressed="true">♯ 升</button>
        <button type="button" data-mode="flat" aria-pressed="false">♭ 降</button>
      </div>
    </section>
    <section id="keyboard" class="keyboard" aria-label="鋼琴鍵盤"></section>
  </main>

  <div class="rotate-hint" role="alert">
    <div class="rotate-icon">⟳</div>
    <p>請將 iPad 橫放</p>
  </div>

  <script src="vendor/vexflow.js"></script>
  <script type="module" src="app.js"></script>

</html>
